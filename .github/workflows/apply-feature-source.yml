name: Apply verified rendering and alignment source
on:
  push:
    branches: [feature/rendering-alignment]
    paths: ['.github/workflows/apply-feature-source.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/feature/rendering-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/rendering-alignment
      - name: Apply exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          encoded=''.join((pathlib.Path('.feature-transfer')/('part'+str(i))).read_text().strip() for i in range(2))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==79838
          assert hashlib.sha256(patch).hexdigest()=='da9d066ac809a4b7bda508595855c716d6a6e1ee7bd468171cf523ef6e446878'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path=pathlib.PurePosixPath(line[6:])
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert path.parts[0] in {'src','tests','samples','scripts','docs','.github','README.md','CHANGELOG.md','Directory.Build.props','mkdocs.yml'}
          target=pathlib.Path('/tmp/feature.patch'); target.write_bytes(patch)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--check',str(target)],check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--index',str(target)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: responsive tile scheduling and atomic page/region alignment'
          git push origin HEAD:refs/heads/feature/rendering-alignment
