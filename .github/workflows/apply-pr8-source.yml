name: Apply verified PR8 source
on:
  push:
    branches: [feature/content-object-editor]
    paths: ['.github/workflows/apply-pr8-source.yml']
permissions:
  contents: write
concurrency:
  group: apply-pr8-source
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/feature/content-object-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/content-object-editor
          fetch-depth: 0
      - name: Verify and apply the exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path('.pr8-transfer') / ('part' + str(i)) for i in range(4)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 142622
          assert hashlib.sha256(patch).hexdigest() == 'a01896d1206ca6f1396d0a1eaea0e8f1c97520e2ea18c627ecf0173a86c05aeb'
          allowed = {'README.md', 'CHANGELOG.md', 'mkdocs.yml'}
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
                  assert '..' not in pathlib.PurePosixPath(path).parts
                  assert path in allowed or path.startswith(('src/ProPDF.', 'tests/ProPDF.', 'docs/'))
          output = pathlib.Path('/tmp/pr8-verified.patch')
          output.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(output)], check=True)
          subprocess.run(['git', 'apply', '--index', str(output)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: owned content-object editing, wrapped text and tiled-rendering corrections'
          git push origin HEAD:refs/heads/feature/content-object-editor
