name: Apply verified inspector correction
on:
  push:
    branches: [feature/content-object-editor]
    paths: ['.github/workflows/apply-pr8-source.yml']
permissions:
  contents: write
concurrency:
  group: apply-pr8-source
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/feature/content-object-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/content-object-editor
          fetch-depth: 0
      - name: Apply hash-verified selector correction and native regression assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.pr8-inspector-fix.b64').read_text(), validate=True))
          assert len(patch) == 7943
          assert hashlib.sha256(patch).hexdigest() == 'df10c7813c03b92506d32cfd68bd20b91852be44e9a3e99e3f76349f51aa6de7'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
                  assert '..' not in pathlib.PurePosixPath(path).parts and path.startswith(('src/ProPDF.', 'tests/ProPDF.'))
          output = pathlib.Path('/tmp/pr8-inspector.patch')
          output.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(output)], check=True)
          subprocess.run(['git', 'apply', '--index', str(output)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): preserve tool selection during viewport updates and compact inspector tabs'
          git push origin HEAD:refs/heads/feature/content-object-editor
