name: Apply verified presentation check
on:
  push:
    branches: [fix/uno-reopen-presentation]
    paths: ['.github/workflows/apply-presentation-source.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/fix/uno-reopen-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/uno-reopen-presentation
      - name: Apply exact reviewed browser test patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.presentation-transfer.b64').read_text(), validate=True))
          assert len(patch) == 5451
          assert hashlib.sha256(patch).hexdigest() == '71595fe77be4b58686cccef394f8508897d93e5f7959ade6e213cfbc74de3d2c'
          allowed = {'samples/ProPDF.Uno.Sample/Platforms/WebAssembly/BrowserTest.cs','scripts/browser/presentation.mjs','scripts/browser/uno-smoke.mjs'}
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'): assert line[6:] in allowed
          output = pathlib.Path('/tmp/presentation.patch'); output.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(output)],check=True)
          subprocess.run(['git','apply','--index',str(output)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(uno): verify actual reopened document presentation, not only tile completion'
          git push origin HEAD:refs/heads/fix/uno-reopen-presentation
