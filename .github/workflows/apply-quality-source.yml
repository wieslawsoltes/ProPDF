name: Apply verified rendering corrections
on:
  push:
    branches: [fix/rendering-fidelity-density]
    paths: ['.github/workflows/apply-quality-source.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/fix/rendering-fidelity-density'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/rendering-fidelity-density
      - name: Verify and apply the locally tested source change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          encoded=''.join((pathlib.Path('.quality-transfer')/('part'+str(i))).read_text().strip() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==94799
          assert hashlib.sha256(patch).hexdigest()=='173745cd8e6c3246f416696184cafb9b7996f31e16ade3c35f55d74a03fe6fea'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path=pathlib.PurePosixPath(line[6:])
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert str(path) in {'README.md','CHANGELOG.md','Directory.Build.props'} or str(path).startswith(('src/','tests/','samples/','scripts/','docs/','.github/workflows/'))
          target=pathlib.Path('/tmp/quality.patch'); target.write_bytes(patch)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--check',str(target)],check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--index',str(target)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: explicit PDF fallback fonts, density-aware thumbnails and exact paint identity'
          git push origin HEAD:refs/heads/fix/rendering-fidelity-density
