name: Apply verified selection source
on:
  push:
    branches: [feature/atomic-content-selection]
    paths: ['.github/workflows/apply-selection-source.yml']
permissions:
  contents: write
concurrency:
  group: apply-selection-source
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/feature/atomic-content-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/atomic-content-selection
          fetch-depth: 0
      - name: Verify and apply tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join((pathlib.Path('.selection-transfer') / ('part' + str(i))).read_text().strip() for i in range(3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 101269
          assert hashlib.sha256(patch).hexdigest() == 'ef81803613e85d8edc2697bb61c16b268ad8a80fdb7f482906457d80d426b053'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
                  assert '..' not in pathlib.PurePosixPath(path).parts
                  assert path in {'README.md', 'CHANGELOG.md'} or path.startswith(('src/ProPDF.', 'tests/ProPDF.', 'docs/'))
          output = pathlib.Path('/tmp/selection.patch')
          output.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(output)], check=True)
          subprocess.run(['git', 'apply', '--index', str(output)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: atomic multi-object editing and native selection workflows'
          git push origin HEAD:refs/heads/feature/atomic-content-selection
