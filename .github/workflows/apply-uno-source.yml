name: Apply verified Uno source
on:
  push:
    branches: [feature/uno-platform]
    paths: ['.github/workflows/apply-uno-source.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/feature/uno-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/uno-platform
      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          encoded=''.join((pathlib.Path('.uno-transfer')/('part'+str(i))).read_text().strip() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==120436
          assert hashlib.sha256(patch).hexdigest()=='0c9cee55609a5629a3cad52442b2db7ff459245e24db578783deec4240ee2d72'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path=pathlib.PurePosixPath(line[6:])
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
          target=pathlib.Path('/tmp/uno.patch'); target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(uno): reusable controls, full shared editor and browser deployment'
          git push origin HEAD:refs/heads/feature/uno-platform
