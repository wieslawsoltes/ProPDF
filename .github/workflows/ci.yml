name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    with:
      # PR/main checks use the standard Intel macOS pool. Release keeps the reusable workflow's ARM64 default.
      macos-runner: macos-26-intel
