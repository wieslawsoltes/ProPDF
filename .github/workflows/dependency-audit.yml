name: Dependency inventory
on:
  push:
    branches: ['feature/owned-pdf-engine']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: license-inventory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ProPDF.slnx
      - name: Record source and dependency licenses
        shell: python
        run: |
          import json, pathlib, subprocess, xml.etree.ElementTree as ET
          out = pathlib.Path('artifacts/inventory'); out.mkdir(parents=True, exist_ok=True)
          subprocess.run(['git', 'archive', '--format=zip', '-o', str(out/'source.zip'), 'HEAD'], check=True)
          packages = {}
          for asset in pathlib.Path('.').rglob('project.assets.json'):
              data = json.loads(asset.read_text())
              for key, value in data['libraries'].items():
                  if value['type'] != 'package': continue
                  for root in data['packageFolders']:
                      directory = pathlib.Path(root)/value['path']
                      for nuspec in directory.glob('*.nuspec'):
                          xml = ET.parse(nuspec)
                          license = next((n for n in xml.iter() if n.tag.split('}')[-1] == 'license'), None)
                          packages[key] = {'license': license.text if license is not None else None, 'type': license.get('type') if license is not None else None}
          (out/'licenses.json').write_text(json.dumps(packages, indent=2))
      - uses: actions/upload-artifact@v7
        with:
          name: source-and-license-inventory
          path: artifacts/inventory/
