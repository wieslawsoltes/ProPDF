name: Materialize owned engine source
on:
  push:
    branches: ['feature/owned-pdf-engine']
    paths: ['.github/workflows/import-owned-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'wieslawsoltes/ProPDF' && github.ref == 'refs/heads/feature/owned-pdf-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/owned-pdf-engine
      - name: Verify transport and expected original blobs before materializing source
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          parts = [root / '.github/source-import' / f'part-{i:02}.txt' for i in range(8)]
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=2 * 1024 * 1024)
          assert decoder.eof and not decoder.unused_data, 'Invalid or oversized source transfer'
          assert len(raw) == 323568
          assert hashlib.sha256(raw).hexdigest() == 'ffa1680fffa6ef9f6ce8270a2b36f71392c0a25254325a5617fdfc7a52c199b4', 'Source integrity mismatch'
          entries = json.loads(raw)['files']
          assert len(entries) == 73
          changes = []
          seen = set()
          allowed_roots = {'src', 'tests', 'samples', 'docs', 'scripts'}
          allowed_top = {'.gitignore', 'CHANGELOG.md', 'Directory.Build.props', 'Directory.Packages.props', 'ProPDF.slnx', 'README.md', 'THIRD-PARTY-NOTICES.md', 'mkdocs.yml'}
          for entry in entries:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in allowed_roots or str(relative) in allowed_top
              assert str(relative) not in seen
              seen.add(str(relative))
              path = root.joinpath(*relative.parts)
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              old = b''
              if entry['base'] is None:
                  assert not path.exists(), f'Unexpected existing file: {relative}'
              else:
                  old = path.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(old)).encode() + b'\0' + old).hexdigest()
                  assert actual == entry['base'], f'Original file changed: {relative}'
              modes = [key for key in ('delete', 'text', 'lines') if key in entry]
              assert len(modes) == 1
              if modes[0] == 'delete':
                  assert entry['delete'] is True and entry['base'] is not None
                  content = None
              elif modes[0] == 'text':
                  content = entry['text']
                  assert isinstance(content, str)
              else:
                  lines = old.decode('utf-8').splitlines(keepends=True)
                  output = []
                  for item in entry['lines']:
                      if isinstance(item, str):
                          output.append(item)
                      else:
                          assert isinstance(item, list) and len(item) == 2
                          a, b = item
                          assert isinstance(a, int) and isinstance(b, int) and 0 <= a <= b <= len(lines)
                          output.extend(lines[a:b])
                  content = ''.join(output)
              changes.append((path, content))
          # Every path and prior blob has been checked before changing any file.
          for path, content in changes:
              if content is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content.encode('utf-8'))
          for part in parts:
              part.unlink()
          print(f'Materialized {len(changes)} verified source changes; removed transfer chunks.')
      - name: Commit reviewable source without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: replace restricted PDF backend with owned kernel and editing libraries'
          git push origin HEAD:feature/owned-pdf-engine
          git rev-parse HEAD
