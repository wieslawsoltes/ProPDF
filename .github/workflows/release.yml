name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v'
        required: true
        default: '0.1.0-alpha.1'
      publish:
        description: 'Publish an existing matching tag reachable from main; requires protected environment approval'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@c604d0cd6c8a7f371b2b92b646b3e6a74aef2c4e
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$INPUT_VERSION"
            if [[ "$INPUT_PUBLISH" == true ]]; then publish=true; fi
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Invalid release version'; exit 1; }
          tag="v$version"
          if [[ "$publish" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main || { echo 'Only commits reachable from main may be published'; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$tag^{commit}")" ]] || { echo 'The immutable release tag must identify this exact commit'; exit 1; }
          fi
          printf 'version=%s\ntag=%s\npublish=%s\n' "$version" "$tag" "$publish" >> "$GITHUB_OUTPUT"
  documentation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@c604d0cd6c8a7f371b2b92b646b3e6a74aef2c4e
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m mkdocs build --strict
  validation:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@c604d0cd6c8a7f371b2b92b646b3e6a74aef2c4e
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ProPDF.slnx
      - name: Build all projects
        shell: pwsh
        run: dotnet build ProPDF.slnx -c Release --no-restore "-p:Version=$env:VERSION"
      - run: dotnet test tests/ProPDF.Tests -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet run --project tests/ProPDF.Avalonia.Smoke -c Release --no-build -- artifacts/headless/avalonia.png
      - if: runner.os == 'Windows'
        run: dotnet run --project tests/ProPDF.Wpf.Smoke -c Release --no-build -- artifacts/headless/wpf.png
      - name: Pack reusable libraries
        shell: pwsh
        run: dotnet pack ProPDF.slnx -c Release --no-build -o artifacts/packages "-p:Version=$env:VERSION"
      - name: Validate external package consumers
        shell: pwsh
        run: ./scripts/verify-packages.ps1 -PackageDirectory artifacts/packages
      - name: Publish self-contained sample archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish samples/ProPDF.Avalonia.Sample -c Release -r $env:RID --self-contained true -p:PublishTrimmed=false "-p:Version=$env:VERSION" -o artifacts/avalonia
          if ($LASTEXITCODE -ne 0) { throw 'Avalonia publish failed' }
          New-Item artifacts/release -ItemType Directory -Force | Out-Null
          if ($IsWindows) {
            Compress-Archive artifacts/avalonia/* "artifacts/release/ProPDF-Avalonia-$env:VERSION-$env:RID.zip"
            dotnet publish samples/ProPDF.Wpf.Sample -c Release -r $env:RID --self-contained true -p:PublishTrimmed=false "-p:Version=$env:VERSION" -o artifacts/wpf
            if ($LASTEXITCODE -ne 0) { throw 'WPF publish failed' }
            Compress-Archive artifacts/wpf/* "artifacts/release/ProPDF-WPF-$env:VERSION-$env:RID.zip"
          } else {
            tar -czf "artifacts/release/ProPDF-Avalonia-$env:VERSION-$env:RID.tar.gz" -C artifacts/avalonia .
            if ($LASTEXITCODE -ne 0) { throw 'Application archive failed' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-validation-${{ matrix.rid }}
          path: artifacts/
          if-no-files-found: warn
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, documentation, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@c604d0cd6c8a7f371b2b92b646b3e6a74aef2c4e
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-validation-*
          path: artifacts/downloaded
      - name: Collect immutable assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          cp artifacts/downloaded/release-validation-linux-x64/packages/*.nupkg artifacts/release/
          cp artifacts/downloaded/release-validation-linux-x64/packages/*.snupkg artifacts/release/
          find artifacts/downloaded -path '*/release/*' -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} artifacts/release/ \;
          git archive --format=zip --prefix="ProPDF-$VERSION/" HEAD > "artifacts/release/ProPDF-$VERSION-source.zip"
          (cd artifacts/release && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'A release already exists; published assets will not be overwritten.'
            exit 1
          fi
      - name: Publish NuGet dependencies in order
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./scripts/publish-packages.ps1 -Version $env:VERSION -PackageDirectory artifacts/release
      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "ProPDF $VERSION" --generate-notes "${flags[@]}" artifacts/release/*
