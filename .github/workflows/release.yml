name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v'
        required: true
        default: '0.1.0-alpha.7'
      publish:
        description: 'Publish the exact matching tag reachable from main; requires environment approval'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; publish=true
          else version="$INPUT_VERSION"; if [[ "$INPUT_PUBLISH" == true ]]; then publish=true; fi; fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Invalid version'; exit 1; }
          tag="v$version"
          if [[ "$publish" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main || { echo 'Only reviewed main commits may publish'; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$tag^{commit}")" ]] || { echo 'Tag must identify this commit'; exit 1; }
          fi
          printf 'version=%s\ntag=%s\npublish=%s\n' "$version" "$tag" "$publish" >> "$GITHUB_OUTPUT"
  validation:
    needs: prepare
    uses: ./.github/workflows/validate.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      artifact-prefix: release-validation
  documentation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m mkdocs build --strict
  applications:
    needs: [prepare, validation, documentation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-26
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Restore every Release graph and required notices
        run: |
          dotnet workload install wasm-tools
          dotnet restore ProPDF.slnx -p:Configuration=Release
          python scripts/collect-license-evidence.py
      - name: Publish self-contained native samples
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish samples/ProPDF.Avalonia.Sample -c Release -r $env:RID --self-contained true -p:PublishTrimmed=false "-p:Version=$env:VERSION" -o artifacts/avalonia
          if ($LASTEXITCODE -ne 0) { throw 'Avalonia publish failed' }
          if ($IsWindows) {
            dotnet publish samples/ProPDF.Wpf.Sample -c Release -r $env:RID --self-contained true -p:PublishTrimmed=false "-p:Version=$env:VERSION" -o artifacts/wpf
            if ($LASTEXITCODE -ne 0) { throw 'WPF publish failed' }
          }
          if ($IsMacOS) {
            dotnet publish samples/ProPDF.Uno.Sample -c Release -f net10.0-desktop -r $env:RID --self-contained true -p:PublishTrimmed=false "-p:Version=$env:VERSION" -o artifacts/uno-native
            if ($LASTEXITCODE -ne 0) { throw 'Uno macOS publish failed' }
          }
      - name: Audit final runtime graphs
        run: |
          python scripts/verify-renderer-source.py
          python scripts/collect-license-evidence.py
          python scripts/audit-licenses.py
      - name: Archive samples with complete dependency notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item artifacts/release -ItemType Directory -Force | Out-Null
          $apps = @(@{ Path='avalonia'; Name='Avalonia' })
          if ($IsWindows) { $apps += @{ Path='wpf'; Name='WPF' } }
          if ($IsMacOS) { $apps += @{ Path='uno-native'; Name='Uno' } }
          foreach ($app in $apps) {
            $path = "artifacts/$($app.Path)"
            Copy-Item LICENSE $path/
            Copy-Item THIRD-PARTY-NOTICES.md $path/
            Copy-Item artifacts/third-party-notices "$path/third-party-notices" -Recurse
            Copy-Item artifacts/upstream-notices "$path/upstream-notices" -Recurse
            Copy-Item artifacts/licenses.json "$path/licenses.json"
            $name = "artifacts/release/ProPDF-$($app.Name)-$env:VERSION-$env:RID"
            if ($IsWindows) { Compress-Archive "$path/*" "$name.zip" }
            else { tar -czf "$name.tar.gz" -C $path .; if ($LASTEXITCODE -ne 0) { throw 'Archive failed' } }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-apps-${{ matrix.rid }}
          path: artifacts/release
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, validation, documentation, applications]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-validation-ubuntu-latest
          path: artifacts/validation
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-apps-*
          merge-multiple: true
          path: artifacts/release
      - name: Collect immutable assets and checksums
        run: |
          set -euo pipefail
          cp artifacts/validation/packages/*.nupkg artifacts/release/
          cp artifacts/validation/packages/*.snupkg artifacts/release/
          git archive --format=zip --prefix="ProPDF-$VERSION/" HEAD > "artifacts/release/ProPDF-$VERSION-source.zip"
          (cd artifacts/release && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then echo 'Existing release assets will not be overwritten'; exit 1; fi
      - name: Publish nine NuGet packages in dependency order
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./scripts/publish-packages.ps1 -Version $env:VERSION -PackageDirectory artifacts/release
      - name: Create GitHub release
        run: |
          set -euo pipefail
          flags=(); if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "ProPDF $VERSION" --generate-notes "${flags[@]}" artifacts/release/*
