name: Inspect pinned rendering source
on:
  push:
    branches: [feature/content-appearance-images]
    paths: ['.github/workflows/renderer-source-bundle.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: BobLd/PdfPig.Rendering.Skia
          ref: e4476d80f98bf1a5a7cd6f7d45fb7c2afe10ec11
          persist-credentials: false
          sparse-checkout: |
            UglyToad.PdfPig.Rendering.Skia
            LICENSE.txt
            NOTICE.txt
            Directory.Build.props
            Directory.Packages.props
          sparse-checkout-cone-mode: false
      - name: Retain source and legal notices only; no fonts or PDF fixtures
        shell: python
        run: |
          import pathlib, zipfile
          root = pathlib.Path('.')
          with zipfile.ZipFile('renderer-source.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  if (path.parts[0] == 'UglyToad.PdfPig.Rendering.Skia' and path.suffix in ('.cs', '.csproj')) or str(path) in ('LICENSE.txt', 'NOTICE.txt', 'Directory.Build.props', 'Directory.Packages.props'):
                      out.write(path, str(path))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pinned-renderer-source
          path: renderer-source.zip
          retention-days: 3
