name: Reusable validation
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.1.0-alpha.4'
      artifact-prefix:
        type: string
        default: validation
      macos-runner:
        description: 'Release defaults to Apple Silicon; PR CI explicitly selects Intel.'
        type: string
        default: macos-26
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, '${{ inputs.macos-runner }}']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact validated source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts/source
          git archive --format=zip --output=artifacts/source/ProPDF-source.zip HEAD
          git rev-parse HEAD > artifacts/source/commit.txt
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Install Uno WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Restore all release dependency graphs
        run: dotnet restore ProPDF.slnx -p:Configuration=Release
      - name: Verify source-pinned renderer and legal notices
        run: python scripts/verify-renderer-source.py
      - name: Collect complete license evidence and enforce policy
        run: |
          python scripts/collect-license-evidence.py
          python scripts/audit-licenses.py
      - name: License gate regression tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Build libraries and native applications
        shell: pwsh
        run: dotnet build ProPDF.slnx -c Release --no-restore "-p:Version=$env:PACKAGE_VERSION"
      - name: Headless engine, editing and viewport regression tests
        run: dotnet test tests/ProPDF.Tests -c Release --no-build --logger trx --results-directory artifacts/tests --collect:"XPlat Code Coverage"
      - name: Avalonia real-Skia headless editor validation
        run: dotnet run --project tests/ProPDF.Avalonia.Smoke -c Release --no-build -- artifacts/headless/avalonia.png
      - name: WPF software-rendered editor validation
        if: runner.os == 'Windows'
        run: dotnet run --project tests/ProPDF.Wpf.Smoke -c Release --no-build -- artifacts/headless/wpf.png
      - name: Pack all libraries including Uno library layout
        shell: pwsh
        # Uno's library-layout target invokes reference builds; --no-build conflicts with that target.
        # This reuses the same Release outputs incrementally and performs no additional restore.
        run: dotnet pack ProPDF.slnx -c Release --no-restore -o artifacts/packages "-p:Version=$env:PACKAGE_VERSION"
      - name: External NuGet consumers
        shell: pwsh
        run: ./scripts/verify-packages.ps1 -PackageDirectory artifacts/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
