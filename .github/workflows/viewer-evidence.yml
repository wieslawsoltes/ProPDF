name: Viewer captured evidence
on:
  push:
    branches: [feat/templated-avalonia-viewer]
    paths: ['.github/workflows/viewer-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: wieslawsoltes/ProPDF
          run-id: 38627601264
          github-token: ${{ github.token }}
          name: avalonia-viewer-validation
          path: evidence
      - name: Read captured browser diagnostics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/browser-dpr1')
          report = json.loads((root / 'report.json').read_text())
          state = report.get('finalState', {})
          print('FAILURE', report.get('error'))
          print('STATE', json.dumps({k:v for k,v in state.items() if k != 'controls'}))
          print('CONTROLS', json.dumps({k:v for k,v in state.get('controls', {}).items() if any(s in k.lower() for s in ('dialog', 'save', 'error'))}))
          print('CONSOLE', (root / 'console.json').read_text())
          print('ERRORS', (root / 'page-errors.json').read_text())
          PY
