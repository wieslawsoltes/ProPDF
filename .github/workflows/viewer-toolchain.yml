name: Viewer isolated toolchain
on:
  push:
    branches: [feat/templated-avalonia-viewer]
    paths: ['.github/workflows/viewer-toolchain.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: wieslawsoltes/ProPDF
          run-id: 38604324336
          github-token: ${{ github.token }}
          pattern: viewer-p*
          path: input
      - name: Split public packs and packages only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          sha256sum input/viewer-packs/packs.tar.gz input/viewer-packages/packages.tar.gz > parts/archive-sha256.txt
          split -b 200M -d input/viewer-packs/packs.tar.gz parts/packs-
          split -b 200M -d input/viewer-packages/packages.tar.gz parts/packages-
          sha256sum parts/packs-* parts/packages-* > parts/part-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-transfer-manifest
          path: parts/*sha256.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packs-00
          path: parts/packs-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packs-01
          path: parts/packs-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packs-02
          path: parts/packs-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packs-03
          path: parts/packs-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packages-00
          path: parts/packages-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packages-01
          path: parts/packages-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packages-02
          path: parts/packages-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packages-03
          path: parts/packages-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-packages-04
          path: parts/packages-04
          compression-level: 0
          retention-days: 1
